<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <!-- This file exists only so Netlify registers these forms at build time. It is never shown to users. -->
    <form name="quote-request" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="propertyType" />
      <input type="text" name="serviceNeeded" />
      <input type="text" name="urgency" />
      <input type="text" name="location" />
      <textarea name="message"></textarea>
      <input type="file" name="photos" />
      <input name="bot-field" />
    </form>

    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <form name="emergency-callout" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="location" />
      <textarea name="issue"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
